[project]
name = "fastapi-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nancycho", email = "nancy1xn1xn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
]

[project.scripts]
fastapi-testing = "fastapi_testing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mysql>=0.0.3",
    "pandas>=2.2.3",
    "pytest>=8.3.5",
]
