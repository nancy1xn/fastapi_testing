name Test

on:
  push:
    branches: [ main ]

jobs: 
  runs-on: ubuntu-latest

  steps:

    - uses: actions/checkout@v2
    - run: sudo apt update
    - run: sudo apt install python3
    - run: python3 --version
    - run: sudo apt update && sudo apt upgrade
    - run: sudo apt install curl
    - run: curl --version
    - run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - run: uv sync
    - run: uv run pytest

